name: Backend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-cd.yaml"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  BACKEND_DIR: starter/backend
  BACKEND_K8S_DIR: starter/backend/k8s

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip pipenv
      - run: pipenv install --dev
      - run: pipenv run lint

  test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip pipenv
      - run: pipenv install --dev
      - run: pipenv run test

  build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t "${ECR_REPOSITORY}:${GITHUB_SHA}" .

  deploy:
    name: Backend Deploy
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Build and push image
        run: |
          docker build -t "${ECR_REPOSITORY}:${GITHUB_SHA}" .
          docker push "${ECR_REPOSITORY}:${GITHUB_SHA}"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Set backend image
        run: |
          cd "${BACKEND_K8S_DIR}"
          kustomize edit set image backend="${ECR_REPOSITORY}:${GITHUB_SHA}"

      - name: Deploy to Kubernetes
        run: |
          cd "${BACKEND_K8S_DIR}"
          kustomize build | kubectl apply -f -