name: Backend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-cd.yaml"
  workflow_dispatch:

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  ECR_REPOSITORY_BACKEND: ${{ secrets.ECR_REPOSITORY_BACKEND }}
  ECR_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY_BACKEND }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: python -m pip install --upgrade pip pipenv
      - run: pipenv install --dev
      - run: pipenv run lint

  test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: python -m pip install --upgrade pip pipenv
      - run: pipenv install --dev
      - run: pipenv run test

  build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: python -m pip install --upgrade pip pipenv
      - run: pipenv install --dev
      - run: pipenv run lint
      - run: pipenv run test

      - name: Validate image settings
        run: |
          test -n "${AWS_ACCOUNT_ID}" || { echo "AWS_ACCOUNT_ID is empty"; exit 1; }
          test -n "${AWS_DEFAULT_REGION}" || { echo "AWS_DEFAULT_REGION is empty"; exit 1; }
          test -n "${ECR_REPOSITORY_BACKEND}" || { echo "ECR_REPOSITORY_BACKEND is empty"; exit 1; }
          test -n "${GITHUB_SHA}" || { echo "GITHUB_SHA is empty"; exit 1; }

      - name: Build Docker image
        run: |
          docker build --file Dockerfile --tag "backend:${GITHUB_SHA}" .
          docker tag "backend:${GITHUB_SHA}" "${ECR_IMAGE}:${GITHUB_SHA}"

  deploy:
    name: Backend Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Build and push image
        working-directory: starter/backend
        run: |
          docker build --file Dockerfile --tag "backend:${GITHUB_SHA}" .
          docker tag "backend:${GITHUB_SHA}" "${ECR_IMAGE}:${GITHUB_SHA}"
          docker push "${ECR_IMAGE}:${GITHUB_SHA}"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_DEFAULT_REGION}"

      - name: Set backend image
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend="${ECR_IMAGE}:${GITHUB_SHA}"

      - name: Deploy to Kubernetes
        working-directory: starter/backend/k8s
        run: |
          kustomize build | kubectl apply -f -

      - name: Print backend public URL
        run: |
          endpoint=""
          for attempt in {1..30}; do
            endpoint=$(kubectl get service backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$endpoint" ]; then
              break
            fi
            sleep 10
          done

          if [ -n "$endpoint" ]; then
            echo "Backend public URL: http://${endpoint}/movies"
          else
            echo "Backend load balancer endpoint is still pending."
            kubectl get service backend -o wide
            exit 1
          fi
